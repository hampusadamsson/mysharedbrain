# MySharedBrain config — copy to `brain.yaml` (git-ignored) or mount as a
# configmap at $BRAIN_CONFIG. Every value here can be overridden by an
# environment variable using the BRAIN__ prefix and __ nesting, e.g.
#
#   BRAIN__AGENT__MODEL=openai:gpt-4o
#   BRAIN__AGENT__API_KEY=sk-…        # injected from a secret, never committed
#
# The settings page in the UI edits this same file. The schedule below is the
# shipped default: three disabled examples, so nothing runs on its own until you
# turn it on deliberately.

agent:
  # Pydantic-AI model string; the provider must be installed.
  model: openai:gpt-4o-mini
  # Any provider, any endpoint. Leave `provider` empty for the default endpoint
  # implied by the model string. Examples of when you would fill it in:
  #
  #   openai-compatible self-hosted (Ollama, vLLM, LM Studio, LiteLLM):
  #   provider: { name: ollama, base_url: http://localhost:11434/v1 }
  #   model: llama3.1
  #
  #   a gateway that needs its own argument names:
  #   provider:
  #     name: litellm
  #     base_url: https://proxy.internal/v1
  #     options: { custom_llm_provider: openai }
  #
  #   Azure OpenAI, which wants the endpoint and an api version:
  #   provider:
  #     name: azure
  #     base_url: https://<resource>.openai.azure.com
  #     api_version: "2024-10-21"
  #
  #   OpenCode Zen Go ($10/mo gateway, https://opencode.ai/zen/go/v1):
  #   provider: { name: opencode }
  #   model: kimi-k2.7-code  # or glm-5.2, deepseek-v4-flash, mimo-v2.5, ...
  #   api_key_env: OPENCODE_API_KEY
  #
  # The settings page lists the providers this install can actually import.
  provider: {}
  # Prefer the env var: leave api_key out and let a secret fill it.
  api_key_env: OPENAI_API_KEY
  # General vault instructions, as a markdown note the librarian may rewrite.
  instructions_file: librarian.md
  instructions: ""
  max_steps: 20
  # Careful, repeatable edits rather than creative writing. Set null to defer to
  # the provider's default.
  temperature: 0.2

# Vault administration: templates, prompts and the wiki layout, all markdown
# in the vault itself. The librarian manages the vault by these docs.
admin:
  # Section holding the admin docs (`<dir>/templates/`, `<dir>/prompts/`).
  dir: admin
  # Wiki layout new pages follow (note id, no `.md` suffix).
  layout_template: admin/templates/layout
  # Page type slug -> template note, e.g. { meeting: admin/templates/meeting }.
  templates: {}
  # Prompt name -> prompt note, e.g. { triage: admin/prompts/triage }.
  prompts: {}

# Ask the librarian: one interactive agent run per question from the Ask page
# (`POST /api/request`). Shaped like a job but with no schedule.
ask:
  # Off = the Ask page and `POST /api/request` refuse to run.
  enabled: true
  # Vault note scoping every answer, e.g. ask-policy. Null = no note.
  instructions_file: null
  # Restrict to these tool names; null = every enabled tool.
  tools: null
  # Restrict to these MCP servers; null = every enabled server.
  mcp_servers: null
  # Step budget override; null = the agent default.
  max_steps: null

scheduler:
  # OFF by default: the jobs below are disabled too, so the librarian never acts
  # on the vault unprompted. Turn this on (and enable a job) when you are ready.
  enabled: false
  tick_seconds: 30
  # Never-run jobs fire immediately on boot instead of after one interval.
  run_on_start: false

# Built-in tools (vault notes + capture queue only). Absent name = enabled.
tools:
  delete_note:
    enabled: false

# Remote MCP servers add tools to every job that allows them. Remote only:
# a local (stdio) server would be shell access, and the librarian has none.
mcp_servers:
  - name: example-http
    transport: http # or: sse
    url: https://mcp.example.com/mcp
    # Extra request headers, e.g. { Authorization: "Bearer …" }.
    headers: {}
    enabled: false
    # Skip TLS certificate verification (self-signed certs). Default false.
    # Only enable for a server you trust on a network you trust: without
    # verification anyone on the path can read and modify the traffic.
    insecure: false

# Scheduled librarian runs. Exactly one of `every` (30m/4h/1d) or `cron` per job.
# All disabled: a capture pipeline plus vault upkeep, not a schedule you agreed
# to. The pipeline flows one way: audit files requests → triage rules on them
# → apply incorporates the approved ones; layout tends the structure itself.
jobs:
  - id: capture-triage
    name: Capture triage
    description: 'Rule on pending capture entries: approve what is worth acting on, reject the rest.'
    enabled: false
    every: 4h
    instructions: |
      List the pending capture queue. For each entry, read the notes it concerns
      and judge against the vault's current content and layout whether it is worth
      acting on. Worth it → approved (capture-apply incorporates it later); not
      worth it → rejected with the reason in the review note. Use approved or
      rejected only — never applied, applying belongs to capture-apply. Never edit
      the vault yourself, and never leave an entry pending silently.
    tools: [list_capture, read_note, search_notes, review_capture]

  - id: capture-apply
    name: Capture apply
    description: 'Incorporate approved capture entries into the vault, then mark them applied.'
    enabled: false
    every: 1d
    instructions: |
      List the approved capture queue and group the entries by note. For each group,
      decide from the entry content and the vault's current content and layout how
      to incorporate it, apply the change with the note tools, then move the entry
      to applied with review_capture — applied requires the written content, so pass
      what you wrote. If an entry went stale or is wrong, reject it with the reason
      instead. Never touch pending entries: triage owns those.
    tools: [list_capture, read_note, search_notes, create_note, update_note, append_note, patch_note, move_note, review_capture]

  - id: vault-layout
    name: Vault layout
    description: 'Own the vault layout template: reshape notes and folders to match it as content evolves.'
    enabled: false
    cron: "0 3 * * 0"
    instructions: |
      Survey every note id and compare the layout against the vault layout template
      (admin/templates/layout, when it exists) and the vault's current content.
      Update the template itself when the content has outgrown it; create, update,
      patch or move individual notes and folders so the whole vault follows it.
      Never delete: file a capture request for removals or moves you are unsure of,
      and let triage rule on it.
    tools: [list_notes, read_note, search_notes, create_note, update_note, append_note, patch_note, move_note, give_feedback]

  - id: vault-audit
    name: Vault audit
    description: 'Walk every note in turn and file a capture request for anything stale, wrong or missing.'
    enabled: false
    cron: "0 4 * * 6"
    instructions: |
      Walk every note in turn. For each one, consider whether it should be updated,
      removed or changed — then file a capture request (edit, missing or request)
      naming the note, what is wrong and where to get the right information. Never
      edit the vault yourself: you propose, triage rules, apply incorporates.
    tools: [list_notes, read_note, search_notes, give_feedback]
