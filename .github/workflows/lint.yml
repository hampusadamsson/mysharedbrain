name: Lint

# Linters and security audits for the parts of the repo that ci-backend and
# ci-frontend do not cover: the workflows themselves, the shell inside them, the
# Dockerfile, and the dependency/security posture of both packages.
#
# A weekly run is included because two of these checks (pip-audit, pnpm audit)
# go stale without any commit: a CVE can be published against a dependency that
# nothing has touched.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"
      - "Dockerfile"
      - ".hadolint.yaml"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "frontend/**"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"
      - "Dockerfile"
      - ".hadolint.yaml"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "frontend/**"
      - ".github/scripts/**"
  schedule:
    - cron: "0 6 * * 1" # Mondays, so advisories surface without a push

permissions:
  contents: read

# One run per branch and workflow: a newer commit makes the previous
# run's answer irrelevant, and the queue is what shows up as noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Workflow schema, expressions, job graph, runner labels.
  actionlint:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12

      - name: actionlint
        run: ./actionlint -color

  # The shell inside `run:` blocks, which actionlint alone does not report.
  shell:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: shellcheck the run blocks
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip install --quiet --disable-pip-version-check pyyaml
          python3 .github/scripts/lint_workflow_shell.py

  # Security audit of the workflows: injection into run blocks, credential
  # persistence, over-broad permissions, unpinned actions (see .github/zizmor.yml
  # for the tag-pin policy).
  zizmor:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@v0.6.4
        with:
          version: 1.30.1
          # Tag pins are allowed for the publishers named in .github/zizmor.yml;
          # everything else must be hash-pinned.
          config: .github/zizmor.yml
          advanced-security: false

  # Dockerfile smells (see .hadolint.yaml).
  hadolint:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  # Static analysis of the backend: the classes of mistake a linter for style
  # will not look for (subprocess use, weak crypto, injected SQL, unsafe YAML).
  # Medium and above fails; everything is reported.
  bandit:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: bandit (medium and above)
        run: |
          set -euo pipefail
          uvx bandit==1.9.1 -q -r src/mysharedbrain -ll

  # Known vulnerabilities in the dependencies that actually ship. The Python
  # side audits the resolved runtime set (what the image installs, --no-dev),
  # not the dev tools.
  dependencies:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: pip-audit the runtime dependency set
        run: |
          set -euo pipefail
          uv export --no-dev --no-header --format requirements-txt \
            | grep -v '^-e ' > /tmp/requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/requirements.txt --progress-spinner off

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm audit (high and above)
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level high
