name: Tag release image

# A published release re-tags the image built from that commit, so a version can
# be deployed instead of a sha. The digest is copied, not rebuilt: the bytes
# that were tested are the bytes that ship.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.2.0)
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release tag and the commit it points at
        id: rel
        env:
          # Interpolating ${{ }} straight into a script runs whatever the value
          # contains: a tag name is attacker-influenced text. env is data.
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_TAG"
          fi
          sha="$(git rev-parse --short=7 "$tag^{commit}" 2>/dev/null || git rev-parse --short=7 HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$sha" >> "$GITHUB_OUTPUT"
          echo "release $tag -> image sha-$sha"

      - name: Check the image exists
        id: have
        env:
          SHA_TAG: ${{ steps.rel.outputs.sha_tag }}
        run: |
          set -euo pipefail
          token=$(curl -s "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull&service=ghcr.io" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/$SHA_TAG")
          echo "found=$([ "$code" = "200" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.have.outputs.found == 'yes'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.have.outputs.found == 'yes'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the manifest to the release tag
        if: steps.have.outputs.found == 'yes'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          SHA_TAG: ${{ steps.rel.outputs.sha_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE:$SHA_TAG"
          docker buildx imagetools inspect "$IMAGE:$TAG"
